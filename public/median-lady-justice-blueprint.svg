<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600" style="display:block;width:100%;height:auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Lady Justice technical blueprint</title>
  <desc id="description">A front-facing Lady Justice with blindfold, balance scales, downward sword, Roman numeral halo, engineering grid, measurements, and construction geometry, drawn in fine ivory lines on dark navy.</desc>
  <defs>
    <linearGradient id="navyField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08151f"/>
      <stop offset=".5" stop-color="#0a1b27"/>
      <stop offset="1" stop-color="#06111a"/>
    </linearGradient>
    <radialGradient id="focusGlow" cx="50%" cy="43%" r="67%">
      <stop offset="0" stop-color="#193b4b" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#102936" stop-opacity=".1"/>
      <stop offset="1" stop-color="#02080d" stop-opacity=".5"/>
    </radialGradient>
    <pattern id="minorGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#89a9b4" stroke-opacity=".085" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#cdd8d6" fill-opacity=".16"/>
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#minorGrid)"/>
      <path d="M200 0H0V200" fill="none" stroke="#9eb5b9" stroke-opacity=".13" stroke-width="1.5"/>
    </pattern>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="2" seed="17"/>
      <feColorMatrix values="1 0 0 0 .6  0 1 0 0 .68  0 0 1 0 .69  0 0 0 .2 0"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="crosshair" fill="none" stroke="currentColor">
      <circle r="9"/>
      <path d="M-16 0H16M0-16V16"/>
      <circle r="2" fill="currentColor" stroke="none"/>
    </g>
    <g id="draftArrow" fill="none" stroke="currentColor" stroke-linecap="square">
      <path d="M0 0H25M0 0l8-5M0 0l8 5"/>
    </g>
    <g id="pan" fill="none" stroke="currentColor" stroke-linejoin="round">
      <path d="M-73 0Q0 30 73 0Q63 56 0 63Q-63 56-73 0Z"/>
      <path d="M-73 0H73M-59 0L0-100M59 0L0-100"/>
      <circle cy="-100" r="5" fill="currentColor" stroke="none"/>
    </g>
    <clipPath id="artboard"><rect width="1600" height="1600" rx="18"/></clipPath>
  </defs>

