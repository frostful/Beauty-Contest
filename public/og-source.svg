<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7c7f86" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <linearGradient id="redWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3232b" stop-opacity=".13"/>
      <stop offset=".6" stop-color="#e3232b" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-35%" y="-25%" width="170%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#e3232b" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#090a0c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="740" height="630" fill="url(#redWash)"/>
  <path d="M0 76H1200M0 560H1200" stroke="#c9c5bb" stroke-opacity=".18"/>
  <path d="M744 76V560" stroke="#c9c5bb" stroke-opacity=".12"/>

  <g transform="translate(70 40)">
    <text x="60" y="35" fill="#f1eee6" font-family="Montserrat,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="6">MEDIAN</text>
  </g>

  <text x="1130" y="63" text-anchor="end" fill="#e3232b" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="3">K♦ / CITIZEN CLASS</text>

  <g transform="translate(72 164)">
    <text x="0" y="42" fill="#f1eee6" font-family="Montserrat,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="7">THE</text>
    <text x="0" y="143" fill="#f1eee6" font-family="Montserrat,Arial,sans-serif" font-size="103" font-weight="900" letter-spacing="-5">BEAUTY</text>
    <text x="0" y="235" fill="#ef202b" font-family="Montserrat,Arial,sans-serif" font-size="91" font-weight="900" letter-spacing="-5">CONTEST</text>
    <rect x="0" y="276" width="64" height="3" fill="#ef202b"/>
    <text x="0" y="326" fill="#c9c6be" font-family="Montserrat,Arial,sans-serif" font-size="21" font-weight="500">Choose a number. Read the room. Survive the average.</text>
  </g>

  <g transform="translate(72 590)" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" letter-spacing="2">
    <text fill="#ef202b">TABLE 0.8</text>
    <text x="104" fill="#8f9197">MULTIPLAYER STRATEGY / CLOSED PROCEEDING</text>
  </g>
</svg>
