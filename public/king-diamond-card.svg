<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-labelledby="title description">
  <title id="title">Classic King of Diamonds playing card</title>
  <desc id="description">A traditional mirrored court card with a crowned king, sceptre, battle axe and red, gold and black robes.</desc>
